<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriConnect — Home</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <div id="offlineBanner" class="offline-banner hidden" data-i18n="will_send_offline">No internet — actions will send automatically when you're back online.</div>
  <div class="topbar">
    <div>
      <h1><span data-i18n="welcome">Welcome</span>, <span id="farmerName"></span> 👋</h1>
      <div class="sub" data-i18n="app_name">AgriConnect</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="voice-btn" onclick="acStartVoiceBooking()" title="Voice Assistant">🎙️</button>
      <select class="lang-select" onchange="acSetLang(this.value)" style="background:#166534;color:white;border:1px solid #22c55e;border-radius:8px;padding:4px 8px;font-weight:600;font-size:13px;cursor:pointer;">
        <option value="en">English</option>
        <option value="hi">हिंदी</option>
        <option value="pa">ਪੰਜਾਬੀ</option>
        <option value="mr">मराठी</option>
      </select>
    </div>
  </div>

  <div class="content">
    <div class="call-banner">📞 <span data-i18n="call_to_book">Book by phone call: 1800-000-000</span></div>

    <button class="btn btn-primary" onclick="location.href='book.html'" style="margin-bottom:10px;">
      🗓️ <span data-i18n="book_slot">Book a Slot (Form)</span>
    </button>
    <button class="btn btn-outline" onclick="acStartVoiceBooking()" style="margin-bottom:16px;background:#fef3c7;border-color:#f59e0b;color:#92400e;">
      🎙️ <span>Full Conversational Voice Booking</span>
    </button>

    <div id="activeBookingCard"></div>
    <div id="groupTeaser"></div>

    <div class="card">
      <h3>📈 <span data-i18n="price_check">Today's Price</span></h3>
      <button class="btn btn-outline" onclick="location.href='price.html'" data-i18n="price_check">Today's Price</button>
    </div>
  </div>

  <div class="bottom-nav">
    <a class="nav-item active" href="home.html"><span class="nav-icon">🏠</span><span data-i18n="welcome">Home</span></a>
    <a class="nav-item" href="bookings.html"><span class="nav-icon">📋</span><span data-i18n="my_bookings">Bookings</span></a>
    <a class="nav-item" href="group.html"><span class="nav-icon">🤝</span><span data-i18n="my_group">Group</span></a>
    <a class="nav-item" href="grievance.html"><span class="nav-icon">🛎️</span><span data-i18n="grievance">Help</span></a>
    <a class="nav-item" href="profile.html"><span class="nav-icon">👤</span><span data-i18n="profile">Profile</span></a>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.2/axios.min.js"></script>
<script src="js/lang.js"></script>
<script src="js/api.js"></script>
<script src="js/voice.js"></script>
<script src="js/voiceBooking.js"></script>
<script src="js/status.js"></script>
<script src="js/home.js"></script>
</body>
</html>

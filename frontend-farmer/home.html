<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriConnect — Home</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div id="offlineBanner" class="offline-banner hidden" data-i18n="will_send_offline">
      No internet — actions will send automatically when you're back online.
    </div>

    <div class="topbar">
      <div>
        <h1><span data-i18n="welcome">Welcome</span>, <span id="farmerName"></span></h1>
        <div class="sub" data-i18n="app_name">AgriConnect</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <select class="lang-select" onchange="acSetLang(this.value)">
          <option value="en">English</option>
          <option value="hi">हिंदी</option>
          <option value="pa">ਪੰਜਾਬੀ</option>
          <option value="mr">मराठी</option>
        </select>
      </div>
    </div>

    <div class="content">
      <div class="call-banner">
        <i class="fa-solid fa-phone" aria-label="phone"></i>
        <span data-i18n="call_to_book">Book by phone call: 1800-000-000 (Toll Free)</span>
      </div>

      <button class="btn btn-primary" onclick="location.href='book.html'" style="margin-bottom:18px;">
        <i class="fa-solid fa-calendar-plus" aria-label="calendar"></i> <span data-i18n="book_slot">Book a Procurement Slot</span>
      </button>

      <div class="grid-2col">
        <div id="activeBookingCard">
          <div class="card skeleton skeleton-card"></div>
        </div>
        <div id="groupTeaser"></div>
      </div>

      <div class="card" style="margin-top:4px;">
        <h3><i class="fa-solid fa-chart-line" aria-label="price check"></i> <span data-i18n="price_check">Today's Mandi Market Price</span></h3>
        <p class="muted" style="margin:4px 0 14px;">Live government MSP and market prices updated for Punjab mandis.</p>
        <button class="btn btn-outline" onclick="location.href='price.html'" data-i18n="price_check">
          <i class="fa-solid fa-magnifying-glass"></i> Check Crop Rates
        </button>
      </div>
    </div>

    <div class="bottom-nav">
      <a class="nav-item active" href="home.html">
        <span class="nav-icon"><i class="fa-solid fa-house" aria-label="home"></i></span>
        <span data-i18n="welcome">Home</span>
      </a>
      <a class="nav-item" href="bookings.html">
        <span class="nav-icon"><i class="fa-solid fa-clipboard-list" aria-label="bookings"></i></span>
        <span data-i18n="my_bookings">Bookings</span>
      </a>
      <a class="nav-item" href="group.html">
        <span class="nav-icon"><i class="fa-solid fa-handshake" aria-label="group"></i></span>
        <span data-i18n="my_group">Group</span>
      </a>
      <a class="nav-item" href="grievance.html">
        <span class="nav-icon"><i class="fa-solid fa-bell" aria-label="help"></i></span>
        <span data-i18n="grievance">Help</span>
      </a>
      <a class="nav-item" href="profile.html">
        <span class="nav-icon"><i class="fa-solid fa-user" aria-label="profile"></i></span>
        <span data-i18n="profile">Profile</span>
      </a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.2/axios.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/api.js"></script>
  <script src="js/status.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
